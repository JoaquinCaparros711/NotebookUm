services: 
    notebookum:
        image: "notebookum:v1.0.0"
        restart: unless-stopped
        networks:
            - notebookum-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.notebookum=true"
            - "traefik.http.routers.notebookum.rule=Host(`notebookum.universidad.localhost`)"
            - "traefik.http.routers.notebookum.tls=true"
            - "traefik.http.services.notebookum.loadbalancer.server.port=5000"
        environments:
          # Flask Configuration
            - FLASK_ENV=${FLASK_ENV}
            - SECRET_KEY=${SECRET_KEY}

            # Database Configuration
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_NAME=${DB_NAME}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_PASSWORD=${REDIS_PASSWORD}

            - # OpenAI API Configuration
            - OPENAI_API_KEY=${OPENAI_API_KEY}

            - # Celery Configuration (for async tasks)
            - CELERY_BROKER_URL=${CELERY_BROKER_URL}
            - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}

            - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE}

            - GEMMA_API_KEY=${GEMMA_API_KEY}
            - GEMMA_API_URL=${GEMMA_API_URL}
networks:
    notebookum-network:
        external: true