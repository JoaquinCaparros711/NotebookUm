services:
    reverse-proxy:
        image: traefik:3.6
        container_name: traefik
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        ports:
            - 80:80
            - 443:443
            - 6379:6379
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
            - ./config/config.yml:/etc/traefik/config.yml:ro
            - ./certs:/etc/certs:ro
        networks:
            - notebookum-network
        labels:
            - "traefik.enable=true"
networks:
    notebookum-network:
        external: true