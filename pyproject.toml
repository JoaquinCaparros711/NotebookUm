[project]
name = "notebookum"
version = "0.1.0"
description = "NotebookUm - Flask web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "openai>=2.29.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
]
