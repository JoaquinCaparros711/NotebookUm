[project]
name = "notebookum"
version = "0.1.0"
description = "NotebookUm - Flask web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "sqlalchemy>=2.0",
    "flask-sqlalchemy>=3.1",
    "mysql-connector-python>=8.0",
    "alembic>=1.13",
    "openai>=2.29.0",
    "docling>=1.0",
    "granian>=1.0",
    "celery>=5.3",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "pylint>=3.0",
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]

[tool.uv]
dev-dependencies = [
    "black>=24.0",
    "flake8>=7.0",
    "pylint>=3.0",
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]
