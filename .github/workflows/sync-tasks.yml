name: Sync Issue Status → tasks.md

on:
  issues:
    types: [closed, reopened]

concurrency:
  group: sync-tasks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull, update tasks.md, commit & push
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python3 - <<'SCRIPT'
          import os, re, glob

          title = os.environ["ISSUE_TITLE"]
          action = os.environ["ISSUE_ACTION"]

          match = re.match(r"^\[(?P<id>T\d+)\]", title)
          if not match:
              print(f"No es una tarea (sin [TXXX]): {title}")
              raise SystemExit(0)

          task_id = match.group("id")
          old = "- [ ]" if action == "closed" else "- [x]"
          new = "- [x]" if action == "closed" else "- [ ]"

          updated = False
          for path in glob.glob("specs/*/tasks.md"):
              text = open(path, encoding="utf-8").read()
              result = re.sub(rf"({re.escape(old)} {task_id}\b)", f"{new} {task_id}", text, count=1)
              if result != text:
                  open(path, "w", encoding="utf-8").write(result)
                  print(f"OK {task_id} -> {'[x]' if action == 'closed' else '[ ]'} en {path}")
                  updated = True

          if not updated:
              print(f"WARN {task_id} no encontrado en ningun tasks.md")
          SCRIPT

          git add "specs/*/tasks.md"
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          TASK_ID=$(echo "$ISSUE_TITLE" | grep -oP '^\[T\d+\]' || echo "task")
          ACTION=$( [ "$ISSUE_ACTION" = "closed" ] && echo "completada" || echo "reabierta" )
          git commit -m "chore(tasks): $TASK_ID $ACTION"
          git push
